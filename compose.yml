services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sketcharena
      POSTGRES_DB: sketcharena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.docker.example to .env first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sketcharena -d sketcharena"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: {context: ., target: game}
    command: [node, dist/server/migrate.js]
    environment:
      DATABASE_URL: postgresql://sketcharena:${POSTGRES_PASSWORD}@postgres:5432/sketcharena
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  game:
    build: {context: ., target: game}
    environment:
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://sketcharena:${POSTGRES_PASSWORD}@postgres:5432/sketcharena
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_GAME_SERVER_URL: ${NEXT_PUBLIC_GAME_SERVER_URL:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
  proxy:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      game: {condition: service_healthy}
      web: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
